name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    name: Lint, typecheck & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Synthetic documents must round-trip the real editor unchanged; the
      # sweep against client databases stays local (see editor/harness).
      - name: Editor conservation harness
        run: bun test editor
        working-directory: apps/admin

      # La suite E2E est LA spécification exécutable du produit (décision
      # 27/07) : elle boote l'API buildée + un MinIO (docker) et rejoue les
      # scénarios Gherkin.
      - name: E2E
        run: bun run test:e2e

  docker:
    name: Docker image (API)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f apps/api/Dockerfile -t commun-api:ci .

      # Le core est instancié AU BOOT (plugin nitro) et refuse de démarrer
      # sans config — le smoke fournit le minimum vital (valeurs factices :
      # le fail-fast vérifie la présence, pas la connectivité).
      - name: Smoke run
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e COMMUN_JWT_SECRET=ci-smoke-secret \
            -e COMMUN_S3_BUCKET=ci-smoke \
            -e COMMUN_S3_ACCESS_KEY=ci-smoke \
            -e COMMUN_S3_SECRET_KEY=ci-smoke \
            -e COMMUN_EMAIL_WEBHOOK_URL=http://127.0.0.1:9/discard \
            commun-api:ci
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/health && exit 0 || sleep 1
          done
          docker logs smoke
          exit 1

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    name: Lint, typecheck & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Sans tokens des registres privés : @poulpus/prose (optionnelle) est
      # simplement sautée — l'API et le core s'installent complets ; l'admin
      # ne builde pas en CI tant que prose n'est pas remplacée (phase 4).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # La suite E2E est LA spécification exécutable du produit (décision
      # 27/07) : elle boote l'API buildée + un MinIO (docker) et rejoue les
      # scénarios Gherkin.
      - name: E2E
        run: bun run test:e2e

  docker:
    name: Docker image (API)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t commun-api:ci .

      - name: Smoke run
        run: |
          docker run -d --name smoke -p 3000:3000 commun-api:ci
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/health && exit 0 || sleep 1
          done
          docker logs smoke
          exit 1

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    name: Typecheck, tests & naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: checks
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile lands with the self-hosting tasks (group 6) — this job
      # is skipped while it does not exist yet.
      - name: Check Dockerfile presence
        id: dockerfile
        run: test -f Dockerfile && echo "present=true" >> "$GITHUB_OUTPUT" || echo "present=false" >> "$GITHUB_OUTPUT"

      - name: Build image
        if: steps.dockerfile.outputs.present == 'true'
        run: docker build -t commun-api:ci .

name: Images

# Dokploy pulls these images; it never builds.
#
# Package visibility (set manually on first push; GitHub defaults to private):
#   - commun-api: public — the self-hosting artifact.
#   - commun-portal: private — migration tooling nobody else can use.
#   - commun-instance: publishable (no more TipTap Pro); merging it into
#     commun-api is planned with the compose work.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'patches/**'
      - 'apps/api/Dockerfile*'
      - 'apps/portal/Dockerfile'
      - 'bun.lock'
      - '.github/workflows/images.yml'

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: commun-api (publique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/commun-app/commun-api:latest
            ghcr.io/commun-app/commun-api:${{ github.sha }}

  portal:
    name: commun-portal (privée — outillage de migration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portal/Dockerfile
          push: true
          tags: |
            ghcr.io/commun-app/commun-portal:latest
            ghcr.io/commun-app/commun-portal:${{ github.sha }}

  instance:
    name: commun-instance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.instance
          # Public browser token — the statically generated admin freezes its
          # runtime config at build time, deploy-time env cannot inject it.
          build-args: |
            NUXT_ENV_MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}
          push: true
          tags: |
            ghcr.io/commun-app/commun-instance:latest
            ghcr.io/commun-app/commun-instance:${{ github.sha }}

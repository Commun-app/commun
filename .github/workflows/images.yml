name: Images

# Build + push des images sur ghcr.io (silent-migration : Dokploy TIRE les
# images, il ne builde pas — décision option B, 29/07).
#
# Visibilité des packages (réglée à la main au premier push, GitHub crée en
# PRIVÉ par défaut) :
#   - commun-api → PUBLIQUE : c'est l'artefact self-hosting (AGPL pur).
#   - commun-portal → PRIVÉE : AGPL certes, mais c'est notre outillage de
#     migration, personne d'autre n'en a l'usage (review PR #6) ; sortira du
#     monorepo avec la vraie app portail du cloud.
#   - commun-instance → PUBLIABLE depuis la sortie de @poulpus/prose
#     (refonte-admin-ui) : plus de TipTap Pro. Basculer la visibilité est un
#     geste manuel (Quentin) ; la fusion avec commun-api en une seule image
#     publique est l'affaire du change 2 (fusion-admin-api).
#
# Plus AUCUN secret de registre privé requis : PROSE_GITHUB_TOKEN et
# TIPTAP_PRO_TOKEN peuvent être supprimés des secrets du dépôt (Quentin).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'patches/**'
      - 'apps/api/Dockerfile*'
      - 'apps/portal/Dockerfile'
      - 'bun.lock'
      - '.github/workflows/images.yml'

permissions:
  contents: read
  packages: write

jobs:
  api:
    name: commun-api (publique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/commun-app/commun-api:latest
            ghcr.io/commun-app/commun-api:${{ github.sha }}

  portal:
    name: commun-portal (privée — outillage de migration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portal/Dockerfile
          push: true
          tags: |
            ghcr.io/commun-app/commun-portal:latest
            ghcr.io/commun-app/commun-portal:${{ github.sha }}

  instance:
    name: commun-instance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.instance
          push: true
          tags: |
            ghcr.io/commun-app/commun-instance:latest
            ghcr.io/commun-app/commun-instance:${{ github.sha }}

# Mises à jour automatiques des dépendances (revue PR #1, 28/07).
# Une PR hebdomadaire groupée par écosystème ; la CI (lint + typecheck +
# E2E complète) fait office de filet de sécurité.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # Pinned by decision; upgraded at milestones only.
      - dependency-name: nitro
      - dependency-name: h3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

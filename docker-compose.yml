# Commun — auto-hébergement de référence, PRODUCTION (spec self-hosting).
# (Pour le développement : docker-compose.dev.yml — MinIO seul, l'app tourne
# en local via `bun run dev`.)
#
#   cp .env.example .env   # ajustez si besoin (port, S3…)
#   docker compose up -d
#
# Les comptes utilisateurs proviennent de la migration legacy ou d'une
# invitation ; le bootstrap d'instance vierge a été retiré (décision 28/07).
#
# Les médias vivent sur un stockage S3-compatible EXTERNE (iso legacy) :
# Scaleway Object Storage en production managée, ou tout équivalent —
# renseignez les COMMUN_S3_* dans .env. L'option « S3 auto-hébergé sur la
# même machine » (Garage) arrivera avec le polish open source (phase 6).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - '${COMMUN_PORT:-3000}:3000'
    env_file: .env
    environment:
      COMMUN_DATA_DIR: /data
    volumes:
      - commun-data:/data
    healthcheck:
      test: ['CMD', 'bun', '-e', 'await fetch("http://127.0.0.1:3000/health").then(r => { if (!r.ok) throw 1 })']
      interval: 30s
      timeout: 5s
      retries: 3

  # TEMPORAIRE (migration silencieuse) : portail de connexion multi-instances
  # — routage email → instance, auth déléguée. Il n'a AUCUN usage en
  # auto-hébergement (une instance = une collectivité) : il est donc derrière
  # un profil et ne démarre pas avec `docker compose up -d`.
  #   docker compose --profile portal up -d
  # Sortira du monorepo avec la vraie app portail privée (section cloud,
  # phases 6-7).
  portal:
    profiles: ['portal']
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    restart: unless-stopped
    ports:
      - '${COMMUN_PORTAL_PORT:-3002}:3000'
    environment:
      PORTAL_MAP: /data/portal-map.json
    volumes:
      # Mapping email → instance, monté depuis l'hôte (jamais dans l'image).
      - ./portal-map.json:/data/portal-map.json:ro

volumes:
  commun-data:

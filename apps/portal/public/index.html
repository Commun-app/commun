<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion</title>
  <!-- Écran ISO legacy (app.poulp.us) : mêmes champs, même sobriété — les
       utilisateurs ne doivent percevoir aucun changement (silent-migration). -->
  <style>
    * { box-sizing: border-box; margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; color: #111827; }
    main { width: 100%; max-width: 24rem; padding: 1.5rem; }
    .logo { text-align: center; margin-bottom: 3rem; font-weight: 700; font-size: 1.5rem; }
    form { display: grid; gap: 1.5rem; }
    input { width: 100%; padding: .625rem .75rem; font-size: .875rem; border: 1px solid #d1d5db; border-radius: .375rem; }
    input:focus { outline: 2px solid #111827; outline-offset: 1px; }
    button { width: 100%; padding: .625rem; font-size: .875rem; color: #fff; background: #000; border: 1px solid #000; border-radius: .375rem; cursor: pointer; }
    button:hover { background: #fff; color: #000; }
    button[disabled] { opacity: .5; cursor: default; }
    .error { color: #b91c1c; font-size: .875rem; text-align: center; min-height: 1.25rem; }
    .hint { font-size: .875rem; text-align: center; opacity: .8; }
    #choices-list { display: flex; flex-direction: column; gap: .5rem; }
    .link { margin-top: 2rem; text-align: center; }
    .link button { width: auto; padding: .25rem; color: #6b7280; background: none; border: none; font-size: .875rem; text-decoration: underline; }
    .link button:hover { color: #111827; background: none; }
  </style>
</head>
<body>
  <main>
    <div class="logo">poulpus</div>
    <form id="login">
      <input type="email" name="email" placeholder="Adresse email" autocomplete="email" required>
      <input type="password" name="password" placeholder="Mot de passe" autocomplete="current-password" required>
      <p class="error" id="error"></p>
      <button type="submit">S'identifier</button>
    </form>
    <p class="link" id="forgot-link">
      <button type="button" id="forgot">Vous avez oublié votre mot de passe ?</button>
    </p>
    <!-- Réinitialisation DIFFUSÉE (voir password-reset.post.ts) : le portail
         ignore où vit le compte, il demande à toutes les instances et n'en dit
         rien à l'utilisateur — la réponse est la même dans tous les cas. -->
    <form id="reset" hidden>
      <p class="hint">
        Entrez votre adresse email et nous vous enverrons un lien pour définir
        un nouveau mot de passe.
      </p>
      <input type="email" name="email" placeholder="Adresse email" autocomplete="email" required>
      <p class="error" id="reset-error"></p>
      <button type="submit">Envoyer le lien</button>
    </form>
    <div id="sent" hidden>
      <p class="hint">
        Si un compte correspond à cette adresse, le lien vient de partir.
        N'hésitez pas à vérifier vos courriers indésirables.
      </p>
    </div>
    <p class="link" id="back-link" hidden>
      <button type="button" id="back">← Revenir à l'écran de connexion</button>
    </p>
    <!-- Affiché seulement quand les identifiants ouvrent PLUSIEURS instances
         (comptes internes) : on demande laquelle plutôt que d'en choisir une
         arbitrairement. -->
    <div id="choices" hidden>
      <p class="hint">Vos identifiants ouvrent plusieurs espaces. Lequel ouvrir ?</p>
      <div id="choices-list"></div>
    </div>
  </main>
  <script>
    const form = document.getElementById('login');
    const error = document.getElementById('error');
    const choices = document.getElementById('choices');
    const choicesList = document.getElementById('choices-list');
    const forgotLink = document.getElementById('forgot-link');
    const backLink = document.getElementById('back-link');
    const reset = document.getElementById('reset');
    const resetError = document.getElementById('reset-error');
    const sent = document.getElementById('sent');

    // Bascule entre les deux écrans : le portail tient en une page, sans routeur.
    function show(step) {
      form.hidden = step !== 'login';
      forgotLink.hidden = step !== 'login';
      reset.hidden = step !== 'reset';
      sent.hidden = step !== 'sent';
      backLink.hidden = step === 'login';
    }
    document.getElementById('forgot').addEventListener('click', () => {
      error.textContent = '';
      show('reset');
    });
    document.getElementById('back').addEventListener('click', () => {
      resetError.textContent = '';
      reset.reset();
      show('login');
    });

    reset.addEventListener('submit', async (event) => {
      event.preventDefault();
      resetError.textContent = '';
      const button = reset.querySelector('button');
      button.disabled = true;
      try {
        const response = await fetch('/password-reset', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(reset))),
        });
        const data = await response.json();
        // Succès affiché sans confirmer que le compte existe — ne pas en faire
        // un oracle d'énumération côté écran non plus.
        if (response.ok && data.sent) {
          show('sent');
          return;
        }
        resetError.textContent = data.error || 'Service momentanément indisponible, réessayez dans un instant';
      } catch {
        resetError.textContent = 'Service momentanément indisponible, réessayez dans un instant';
      } finally {
        button.disabled = false;
      }
    });

    function offerChoices(list) {
      form.hidden = true;
      forgotLink.hidden = true;
      choicesList.replaceChildren(
        ...list.map(({ slug, url }) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = slug;
          button.addEventListener('click', () => location.assign(url));
          return button;
        }),
      );
      choices.hidden = false;
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const data = await response.json();
        if (response.ok && data.url) {
          location.assign(data.url);
          return;
        }
        if (response.ok && Array.isArray(data.choices)) {
          offerChoices(data.choices);
          return;
        }
        error.textContent = data.error || 'Identifiants invalides';
      } catch {
        error.textContent = 'Service momentanément indisponible, réessayez dans un instant';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
